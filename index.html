<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Joshua Tree (U2) · infografía interactiva</title>
<meta name="description" content="Infografía interactiva sobre el álbum The Joshua Tree de U2: un árbol cuyas ramas son las formas de onda de las canciones y cuyas copas son sus atributos sonoros según Spotify.">
<meta name="author" content="Javi Cantón-Correa">
<meta name="theme-color" content="#221f20">
<link rel="icon" href="data:,">
<link rel="preload" href="assets/fonts/source-sans-3-latin-300-italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <p class="intro" id="intro"></p>
  <div class="now" id="now" hidden>
    <button type="button" class="now-toggle" id="now-toggle"></button>
    <button type="button" class="now-title" id="now-title"></button>
    <span class="now-time" id="now-time"></span>
  </div>
  <div class="lang" role="group" aria-label="Idioma / Language">
    <button type="button" data-lang="es" aria-pressed="true">ES</button>
    <button type="button" data-lang="en" aria-pressed="false">EN</button>
  </div>
  <div class="tools" id="tools"></div>
</header>

<main id="stage">
  <!-- En pantallas estrechas el título y la foto van en HTML y el SVG muestra solo el árbol -->
  <section class="m-only" id="m-head"></section>

  <svg id="viz" role="img" aria-labelledby="viz-title" preserveAspectRatio="xMidYMin meet">
    <title id="viz-title">The Joshua Tree, U2</title>
  </svg>

  <!-- Bloques en HTML que sustituyen a la leyenda y los créditos del SVG en pantallas estrechas -->
  <section class="m-only" id="m-tracks"></section>
  <section class="m-only" id="m-legend"></section>
  <section class="m-only" id="m-credits"></section>
  <footer class="d-only" id="foot"></footer>
</main>

<div id="tip" role="tooltip" hidden></div>
<aside id="panel" aria-hidden="true" tabindex="-1"></aside>

<noscript><p style="color:#efe9da;padding:2rem;text-align:center">Esta infografía necesita JavaScript.</p></noscript>

<script src="js/vendor/d3.min.js"></script>
<script src="js/i18n.js"></script>
<script src="js/main.js"></script>
</body>
</html>
